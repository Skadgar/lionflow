name: Download count

# Counts downloads of LionFlow.apk (the README / first-install link) across all releases,
# using GitHub's own public download counters. Nothing is collected by the app or by us.
on:
  workflow_run:
    workflows: [ "Build APK" ]
    types: [ completed ]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Count downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
              -q '[.[].assets[] | select(.name=="LionFlow.apk") | .download_count] | add // 0' | awk '{s+=$1} END {print s+0}')
          echo "Downloads: $n"
          # Active devices: GitHub installs fetch ping.txt once a day. Keep a short history and show the last 24 hours.
          pings=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
              -q '[.[].assets[] | select(.name=="ping.txt") | .download_count] | add // 0' | awk '{s+=$1} END {print s+0}')
          now=$(date +%s)
          mkdir out && cd out
          curl -fsS "https://raw.githubusercontent.com/${{ github.repository }}/stats/pings.csv" -o pings.csv 2>/dev/null || : > pings.csv
          echo "$now,$pings" >> pings.csv
          tail -n 600 pings.csv > p.tmp && mv p.tmp pings.csv
          # the newest entry that is at least 24 h old (if there is none yet, the badge says so)
          old=$(awk -F, -v t=$((now-86400)) '$1<=t {v=$2} END {print v}' pings.csv)
          if [ -n "$old" ]; then d=$((pings-old)); [ $d -lt 0 ] && d=0; msg="$d"; else msg="counting…"; fi
          printf '{"schemaVersion":1,"label":"active users (last 24h)","message":"%s","color":"0b7a75"}\n' "$msg" > devices.json
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"8bc34a"}\n' "$n" > downloads.json
          git init -q -b stats
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add downloads.json devices.json pings.csv
          git commit -q -m "Download count: $n"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" stats
