name: One-time cleanup of old releases
on:
  push:
    branches: [ main ]
    paths: [ ".github/workflows/cleanup-releases.yml" ]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every release and tag except v1.0.46
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          KEEP=v1.0.46
          gh api --paginate "repos/$REPO/releases?per_page=100" -q '.[] | "\(.id) \(.tag_name)"' | while read id tag; do
            if [ "$tag" != "$KEEP" ]; then echo "delete release $tag"; gh api -X DELETE "repos/$REPO/releases/$id"; fi
          done
          gh api --paginate "repos/$REPO/tags?per_page=100" -q '.[].name' | while read tag; do
            if [ "$tag" != "$KEEP" ]; then echo "delete tag $tag"; gh api -X DELETE "repos/$REPO/git/refs/tags/$tag"; fi
          done
