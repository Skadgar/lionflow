# One-off: packs the signing key, encrypted for Google Play (Play App Signing), so Play uses the same key as GitHub builds.
# The output is encrypted with Google's public key; only Google can read it.
name: Export key for Play
on: workflow_dispatch
jobs:
  pepk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Encrypt key for Google
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          curl -sSfL -o "$RUNNER_TEMP/pepk.jar" https://www.gstatic.com/play-apps-publisher-rapid/signing-tool/prod/pepk.jar
          java -jar "$RUNNER_TEMP/pepk.jar" --keystore="$RUNNER_TEMP/release.jks" --alias="$KEY_ALIAS" \
            --output=lionflow-play-key.zip --include-cert --rsa-aes-encryption \
            --encryption-key-path=.github/play/encryption_public_key.pem \
            --keystore-pass="pass:$STORE_PASS" --key-pass="pass:$KEY_PASS"
          rm -f "$RUNNER_TEMP/release.jks"
          ls -l lionflow-play-key.zip
      - uses: actions/upload-artifact@v4
        with: { name: lionflow-play-key, path: lionflow-play-key.zip, retention-days: 1 }
