name: Charger tiles

# Builds the fast-charger map tiles the trip planner downloads (OpenStreetMap data, via Overpass) and
# publishes them on the "chargers" branch, so the app gets them from GitHub's fast CDN instead of asking
# the busy free Overpass servers while you wait. Nothing is collected from users.
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Get the previous tiles
        run: |
          mkdir out
          git fetch origin chargers:chargers 2>/dev/null && git --work-tree=out checkout chargers -- . 2>/dev/null || true
          git reset -q
      - name: Build
        run: python3 scripts/build_chargers.py out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          rm -rf .git
          git init -q -b chargers
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Charger tiles $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" chargers
