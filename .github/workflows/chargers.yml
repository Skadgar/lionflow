name: Charger tiles

# Builds the fast-charger map tiles the trip planner downloads and publishes them on the "chargers" branch, so the
# app gets them from GitHub's fast CDN instead of asking the busy free Overpass servers while you wait.
# Source: the OpenStreetMap Europe file from Geofabrik (no Overpass). Nothing is collected from users.
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Download Europe
        run: |
          sudo mkdir -p /mnt/w && sudo chown "$USER" /mnt/w
          df -h /mnt
          curl -fL --retry 5 --retry-delay 20 -A "LionFlow-charger-tiles (https://github.com/thocubeat/lionflow)" \
            -o /mnt/w/europe.osm.pbf https://download.geofabrik.de/europe-latest.osm.pbf
          ls -lh /mnt/w
      - name: Cut out the charging stations
        run: |
          osmium tags-filter /mnt/w/europe.osm.pbf nwr/amenity=charging_station -o /mnt/w/cs.osm.pbf
          osmium export /mnt/w/cs.osm.pbf -f geojsonseq --geometry-types=point,polygon --add-unique-id=type_id -o /mnt/w/cs.geojsonseq
          ls -lh /mnt/w
      - name: Build tiles
        run: python3 scripts/build_chargers.py /mnt/w/cs.geojsonseq out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b chargers
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Charger tiles $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" chargers
